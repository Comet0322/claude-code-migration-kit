[project]
name = "corplib"
version = "0.1.0"
description = "Simulated company internal all-in-one library (DB + logging) — real minimal implementation for migration-kit test infrastructure, not production code"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
